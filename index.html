<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdontoPluz - Sistema de Agendamiento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0d3b66;
            --primary-light: #1a5490;
            --secondary: #6b7280;
            --light: #f3f4f6;
            --white: #ffffff;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #1f2937;
            --border: #e5e7eb;
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background-color: var(--light);
            line-height: 1.6;
        }

        /* HEADER SIMPLIFICADO */
        header {
            background: var(--white);
            padding: 0;
        }

        .header-banner {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            text-align: center;
            padding: 1rem;
            min-height: 150px;
        }

        .header-banner img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .header-logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            background: var(--white);
            border-bottom: 3px solid var(--primary);
            position: relative;
        }

        .logo-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            margin-bottom: 0.8rem;
            box-shadow: 0 4px 12px rgba(13, 59, 102, 0.2);
            overflow: hidden;
            position: relative;
            margin-top: -50px;
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .business-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
        }

        /* MAIN CONTAINER - MOBILE */
        .container {
            padding: 0.8rem;
            max-width: 100%;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--white);
            padding: 1.2rem;
            border-radius: var(--radius);
            margin-bottom: 1.2rem;
            text-align: center;
            box-shadow: 0 4px 12px rgba(13, 59, 102, 0.15);
        }

        .hero h1 {
            font-size: 1.2rem;
            margin-bottom: 0.6rem;
            font-weight: 700;
        }

        .hero p {
            font-size: 0.85rem;
            opacity: 0.95;
        }

        /* SECCIÓN DE DOCTORES - CARRUSEL */
        .doctores-section {
            margin-bottom: 1rem;
        }

        .doctores-section h2 {
            color: var(--primary);
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
        }

        .doctores-carrusel {
            display: flex;
            overflow-x: auto;
            gap: 0.8rem;
            scroll-snap-type: x mandatory;
            padding-bottom: 0.5rem;
            -webkit-overflow-scrolling: touch;
        }

        .doctores-carrusel::-webkit-scrollbar {
            height: 4px;
        }

        .doctores-carrusel::-webkit-scrollbar-track {
            background: var(--light);
            border-radius: 10px;
        }

        .doctores-carrusel::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .doctor-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            min-width: 200px;
            flex-shrink: 0;
            scroll-snap-align: start;
        }

        .doctor-card:active {
            transform: scale(0.98);
            box-shadow: 0 4px 12px rgba(13, 59, 102, 0.15);
        }

        .doctor-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: rgba(255,255,255,0.3);
            overflow: hidden;
        }

        .doctor-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .doctor-info {
            padding: 1rem;
        }

        .doctor-name {
            color: var(--primary);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            line-height: 1.2;
        }

        .doctor-specialty {
            color: var(--primary-light);
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.8rem;
        }

        .doctor-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: var(--secondary);
        }

        /* SECCIÓN CARACTERÍSTICAS */
        .caracteristicas-section {
            margin-bottom: 1.5rem;
        }

        .caracteristicas-section h2 {
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .caracteristicas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .caracteristica-item {
            background: var(--white);
            padding: 1rem;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .caracteristica-emoji {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .caracteristica-titulo {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .caracteristica-desc {
            color: var(--secondary);
            font-size: 0.8rem;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        /* FORM */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* PASOS */
        .pasos-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .paso {
            background: var(--light);
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--secondary);
        }

        .paso.activo {
            background: var(--primary);
            color: var(--white);
        }

        /* SERVICIOS */
        .servicios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .servicio-card {
            background: var(--white);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .servicio-card.selected {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--white);
            border-color: var(--primary);
        }

        .servicio-emoji {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .servicio-nombre {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .servicio-duracion {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* FOOTER */
        footer {
            background: var(--primary);
            color: var(--white);
            padding: 1.5rem;
            text-align: center;
            margin-top: 2rem;
            border-top: 3px solid var(--primary-light);
        }

        footer p {
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .social-links a {
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* LOADER */
        .loader {
            text-align: center;
            padding: 2rem;
            color: var(--primary);
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-banner" id="headerBanner">
            <img src="https://via.placeholder.com/1200x600" alt="Banner">
        </div>
        <div class="header-logo-section">
            <div class="logo-circle" id="logoCircle">🦷</div>
            <h1 class="business-name" id="businessName">OdontoPluz</h1>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        <!-- HERO -->
        <div class="hero">
            <h1 id="heroTitle">Agendar tu Cita</h1>
            <p id="heroSubtitle">Consulta con nuestros especialistas</p>
        </div>

        <!-- DOCTORES PREVIEW -->
        <div class="doctores-section">
            <h2>Nuestros Especialistas</h2>
            <div class="doctores-carrusel" id="doctoresPreview"></div>
        </div>

        <!-- CARACTERÍSTICAS -->
        <div class="caracteristicas-section">
            <h2 id="caracteristicasTitle">¿Por qué elegir OdontoPluz?</h2>
            <div class="caracteristicas-grid" id="caracteristicasGrid"></div>
        </div>

        <!-- BOOKING WIZARD -->
        <div id="bookingSection" style="display: none; margin-top: 2rem;">
            <div class="pasos-container" id="stepsContainer"></div>
            
            <!-- PASO 1: SERVICIOS -->
            <div id="paso1" style="display: none;">
                <h2>Selecciona el Servicio</h2>
                <div class="servicios-grid" id="serviciosGrid"></div>
                <button class="btn-primary" onclick="irAlPaso(2)" style="width: 100%;">Continuar</button>
            </div>

            <!-- PASO 2: DOCTOR -->
            <div id="paso2" style="display: none;">
                <h2>Selecciona el Doctor</h2>
                <div class="servicios-grid" id="doctoresSeleccionGrid"></div>
                <button class="btn-primary" onclick="irAlPaso(3)" style="width: 100%;">Continuar</button>
            </div>

            <!-- PASO 3: FECHA -->
            <div id="paso3" style="display: none;">
                <h2>Selecciona Fecha</h2>
                <div class="form-group">
                    <input type="date" id="datePicker">
                </div>
                <button class="btn-primary" onclick="irAlPaso(4)" style="width: 100%;">Continuar</button>
            </div>

            <!-- PASO 4: HORA -->
            <div id="paso4" style="display: none;">
                <h2>Selecciona Hora</h2>
                <div class="servicios-grid" id="horariosGrid"></div>
                <button class="btn-primary" onclick="irAlPaso(5)" style="width: 100%;">Continuar</button>
            </div>

            <!-- PASO 5: DATOS -->
            <div id="paso5" style="display: none;">
                <h2>Completa tus Datos</h2>
                <form onsubmit="confirmarCita(event)">
                    <div class="form-group">
                        <label>Nombre Completo *</label>
                        <input type="text" id="nombre" placeholder="Tu nombre completo" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono *</label>
                        <input type="tel" id="telefono" placeholder="+584121234567" required>
                    </div>
                    <div class="form-group">
                        <label>Comentario</label>
                        <textarea id="asunto" placeholder="¿Tienes alguna pregunta o comentario?"></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">✓ Confirmar Cita</button>
                </form>
            </div>
        </div>

        <!-- BOTÓN PARA INICIAR BOOKING (visible al inicio) -->
        <div id="initialButton" style="text-align: center; margin: 2rem 0;">
            <button class="btn-primary" onclick="iniciarBooking()" style="width: 100%; padding: 1.2rem; font-size: 1.1rem;">
                📅 Agendar Cita
            </button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p id="footerCopyright">© 2024 OdontoPluz. Todos los derechos reservados.</p>
        <div class="social-links">
            <a id="instagramLink" href="#">Instagram</a>
            <a id="facebookLink" href="#">Facebook</a>
            <a id="tiktokLink" href="#" style="display: none;">TikTok</a>
        </div>
    </footer>

    <!-- MODAL -->
    <div class="modal" id="modal"></div>

    <script>
        // ====== CONFIGURACIÓN CSV ======
        // Cambiar esta URL a tu Google Sheets o CSV local
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQJaK0ZwEy0TyF3XSiig7-kqVFX3Xh3GV7aNUKZiAD-q5AjTheyhvAN_9QgbQvqSy1Nn6Iphs3HRpUb/pub?output=csv';

        // Variables globales
        let config = {};
        let servicios = [];
        let doctores = [];
        let caracteristicas = [];
        let textos = {};

        let estadoBooking = {
            pasoActual: 1,
            servicioSeleccionado: null,
            doctorSeleccionado: null,
            fechaSeleccionada: null,
            horaSeleccionada: null,
            nombre: '',
            email: '',
            telefono: '',
            asunto: ''
        };

        // ====== CARGAR CSV ======
        async function cargarCSV() {
            try {
                console.log('Cargando CSV desde:', CSV_URL);
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                parsearCSV(csvText);
                inicializarPagina();
            } catch (error) {
                console.error('Error cargando CSV:', error);
                mostrarError('No se pudo cargar la configuración. Intenta más tarde.');
            }
        }

        // ====== PARSEAR CSV ======
        function parsearCSV(csvText) {
            const lineas = csvText.split('\n').filter(l => l.trim());
            const encabezados = lineas[0].split(',').map(h => h.trim());
            
            // Índices de columnas
            const idxSeccion = encabezados.indexOf('SECCION');
            const idxCampo = encabezados.indexOf('CAMPO');
            const idxValor = encabezados.indexOf('VALOR');

            // Procesar cada línea
            for (let i = 1; i < lineas.length; i++) {
                // Parse CSV respetando comillas
                const valores = parseCSVLine(lineas[i]);
                if (valores.length < 3) continue;

                const seccion = valores[0].trim();
                const campo = valores[1].trim();
                let valor = valores[2].trim();

                // Procesar según sección
                if (seccion === 'CONSULTORIO') {
                    config[campo] = valor;
                } else if (seccion === 'HEADER') {
                    config[campo] = valor;
                } else if (seccion === 'TEXTOS') {
                    textos[campo] = valor;
                } else if (seccion === 'SERVICIOS') {
                    procesarServicio(campo, valor);
                } else if (seccion === 'DOCTORES') {
                    procesarDoctor(campo, valor);
                } else if (seccion === 'CARACTERISTICAS') {
                    procesarCaracteristica(campo, valor);
                } else if (seccion === 'GOOGLE_CALENDAR') {
                    config[campo] = valor;
                } else if (seccion === 'REDES_SOCIALES') {
                    config['social_' + campo] = valor;
                } else if (seccion === 'FOOTER') {
                    config[campo] = valor;
                }
            }

            console.log('Config:', config);
            console.log('Servicios:', servicios);
            console.log('Doctores:', doctores);
        }

        // ====== PARSER CSV (respeta comillas) ======
        function parseCSVLine(line) {
            const resultado = [];
            let current = '';
            let insideQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    insideQuotes = !insideQuotes;
                } else if (char === ',' && !insideQuotes) {
                    resultado.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            resultado.push(current);
            return resultado;
        }

        // ====== PROCESAR SERVICIOS ======
        function procesarServicio(campo, valor) {
            const match = campo.match(/id_(\d+)_(.*)/);
            if (!match) return;

            const id = match[1];
            const propiedad = match[2];

            if (!servicios[id - 1]) {
                servicios[id - 1] = { id: id };
            }

            if (propiedad === 'nombre') {
                servicios[id - 1].nombre = valor;
            } else if (propiedad === 'duracion_min') {
                servicios[id - 1].duracion = parseInt(valor) || 30;
            } else if (propiedad === 'precio') {
                servicios[id - 1].precio = valor === 'null' ? null : parseFloat(valor);
            } else if (propiedad === 'imagen_url') {
                servicios[id - 1].emoji = valor || '🦷';
            }
        }

        // ====== PROCESAR DOCTORES ======
        function procesarDoctor(campo, valor) {
            const match = campo.match(/id_(\d+)_(.*)/);
            if (!match) return;

            const id = match[1];
            const propiedad = match[2];

            if (!doctores[id - 1]) {
                doctores[id - 1] = { id: id, citas: [], especialidades: [] };
            }

            if (propiedad === 'nombre') {
                doctores[id - 1].nombre = valor;
            } else if (propiedad === 'especialidad') {
                doctores[id - 1].especialidad = valor;
            } else if (propiedad === 'descripcion') {
                doctores[id - 1].descripcion = valor;
            } else if (propiedad === 'especialidades') {
                doctores[id - 1].especialidades = valor.split(';').map(e => e.trim());
            } else if (propiedad === 'foto_url') {
                doctores[id - 1].foto = valor || '👩‍⚕️';
            }
        }

        // ====== PROCESAR CARACTERÍSTICAS ======
        function procesarCaracteristica(campo, valor) {
            const match = campo.match(/id_(\d+)_(.*)/);
            if (match) {
                const id = match[1];
                const propiedad = match[2];

                if (!caracteristicas[id - 1]) {
                    caracteristicas[id - 1] = { id: id };
                }

                if (propiedad === 'emoji') {
                    caracteristicas[id - 1].emoji = valor;
                } else if (propiedad === 'titulo') {
                    caracteristicas[id - 1].titulo = valor;
                } else if (propiedad === 'descripcion') {
                    caracteristicas[id - 1].descripcion = valor;
                }
            } else if (campo === 'titulo_seccion') {
                config.caracteristicas_titulo = valor;
            }
        }

        // ====== INICIALIZAR PÁGINA ======
        function inicializarPagina() {
            // Actualizar tema de colores
            if (config.color_primario) {
                document.documentElement.style.setProperty('--primary', config.color_primario);
            }
            if (config.color_secundario) {
                document.documentElement.style.setProperty('--secondary', config.color_secundario);
            }

            // Actualizar header
            document.title = config.nombre || 'OdontoPluz';
            document.getElementById('businessName').textContent = config.nombre || 'OdontoPluz';
            document.getElementById('logoCircle').textContent = config.logo_emoji || '🦷';
            document.getElementById('heroTitle').textContent = config.titulo_principal || 'Agendar tu Cita';
            document.getElementById('heroSubtitle').textContent = config.subtitulo || 'Consulta con nuestros especialistas';

            if (config.banner_url) {
                document.getElementById('headerBanner').innerHTML = `<img src="${config.banner_url}" alt="Banner">`;
            }

            // Actualizar footer
            document.getElementById('footerCopyright').textContent = config.texto_copyright || '© 2024 OdontoPluz';
            
            if (config.social_instagram) {
                document.getElementById('instagramLink').textContent = config.social_instagram;
                document.getElementById('instagramLink').href = `https://instagram.com/${config.social_instagram.replace('@', '')}`;
            }
            
            if (config.social_facebook) {
                document.getElementById('facebookLink').textContent = config.social_facebook;
                document.getElementById('facebookLink').href = `https://facebook.com/${config.social_facebook}`;
            }

            if (config.social_tiktok) {
                document.getElementById('tiktokLink').style.display = 'inline';
                document.getElementById('tiktokLink').textContent = config.social_tiktok;
                document.getElementById('tiktokLink').href = `https://tiktok.com/@${config.social_tiktok.replace('@', '')}`;
            }

            // Renderizar doctores preview
            renderizarDoctoresPreview();

            // Renderizar características
            renderizarCaracteristicas();
        }

        // ====== RENDERIZAR DOCTORES PREVIEW ======
        function renderizarDoctoresPreview() {
            const container = document.getElementById('doctoresPreview');
            container.innerHTML = '';

            doctores.forEach(doctor => {
                if (!doctor) return;
                const card = document.createElement('div');
                card.className = 'doctor-card';
                card.innerHTML = `
                    <div class="doctor-image">${doctor.foto}</div>
                    <div class="doctor-info">
                        <div class="doctor-name">${doctor.nombre}</div>
                        <div class="doctor-specialty">${doctor.especialidad}</div>
                        <div class="doctor-rating">⭐ Ver perfil</div>
                    </div>
                `;
                card.addEventListener('click', () => verPerfilDoctor(doctor.id));
                container.appendChild(card);
            });
        }

        // ====== RENDERIZAR CARACTERÍSTICAS ======
        function renderizarCaracteristicas() {
            const container = document.getElementById('caracteristicasGrid');
            container.innerHTML = '';
            document.getElementById('caracteristicasTitle').textContent = config.caracteristicas_titulo || '¿Por qué elegir OdontoPluz?';

            caracteristicas.forEach(car => {
                if (!car || !car.titulo) return;
                const item = document.createElement('div');
                item.className = 'caracteristica-item';
                item.innerHTML = `
                    <div class="caracteristica-emoji">${car.emoji}</div>
                    <div class="caracteristica-titulo">${car.titulo}</div>
                    <div class="caracteristica-desc">${car.descripcion}</div>
                `;
                container.appendChild(item);
            });
        }

        // ====== INICIAR BOOKING ======
        function iniciarBooking() {
            document.getElementById('initialButton').style.display = 'none';
            document.getElementById('bookingSection').style.display = 'block';
            irAlPaso(1);
        }

        // ====== IR AL PASO ======
        function irAlPaso(paso) {
            estadoBooking.pasoActual = paso;
            actualizarUI();
        }

        // ====== ACTUALIZAR UI ======
        function actualizarUI() {
            // Ocultar todos los pasos
            document.getElementById('paso1').style.display = 'none';
            document.getElementById('paso2').style.display = 'none';
            document.getElementById('paso3').style.display = 'none';
            document.getElementById('paso4').style.display = 'none';
            document.getElementById('paso5').style.display = 'none';

            // Mostrar paso actual
            document.getElementById(`paso${estadoBooking.pasoActual}`).style.display = 'block';

            // Actualizar indicadores de pasos
            document.querySelectorAll('.paso').forEach((el, i) => {
                el.classList.remove('activo');
                if (i + 1 === estadoBooking.pasoActual) {
                    el.classList.add('activo');
                }
            });

            // Renderizar contenido según paso
            if (estadoBooking.pasoActual === 1) {
                renderizarServicios();
            } else if (estadoBooking.pasoActual === 2) {
                renderizarDoctoresSeleccion();
            } else if (estadoBooking.pasoActual === 4) {
                renderizarHorarios();
            }
        }

        // ====== CREAR PASOS ======
        function crearPasos() {
            const container = document.getElementById('stepsContainer');
            const pasos = ['Inicio', 'Servicio', 'Doctor', 'Fecha y Hora', 'Datos'];
            container.innerHTML = pasos.map((p, i) => `<div class="paso">${i + 1}</div>`).join('');
        }

        // ====== RENDERIZAR SERVICIOS ======
        function renderizarServicios() {
            const container = document.getElementById('serviciosGrid');
            container.innerHTML = '';

            servicios.forEach(servicio => {
                if (!servicio) return;
                const card = document.createElement('div');
                card.className = 'servicio-card';
                if (estadoBooking.servicioSeleccionado === servicio.id) {
                    card.classList.add('selected');
                }
                card.innerHTML = `
                    <div class="servicio-emoji">${servicio.emoji}</div>
                    <div class="servicio-nombre">${servicio.nombre}</div>
                    <div class="servicio-duracion">${servicio.duracion} min</div>
                `;
                card.addEventListener('click', () => {
                    estadoBooking.servicioSeleccionado = servicio.id;
                    actualizarUI();
                });
                container.appendChild(card);
            });
        }

        // ====== RENDERIZAR DOCTORES SELECCIÓN ======
        function renderizarDoctoresSeleccion() {
            const container = document.getElementById('doctoresSeleccionGrid');
            container.innerHTML = '';

            doctores.forEach(doctor => {
                if (!doctor) return;
                const card = document.createElement('div');
                card.className = 'servicio-card';
                if (estadoBooking.doctorSeleccionado === doctor.id) {
                    card.classList.add('selected');
                }
                card.innerHTML = `
                    <div class="servicio-emoji">${doctor.foto}</div>
                    <div class="servicio-nombre">${doctor.nombre}</div>
                    <div class="servicio-duracion">${doctor.especialidad}</div>
                `;
                card.addEventListener('click', () => {
                    estadoBooking.doctorSeleccionado = doctor.id;
                    actualizarUI();
                });
                container.appendChild(card);
            });
        }

        // ====== RENDERIZAR HORARIOS ======
        function renderizarHorarios() {
            const container = document.getElementById('horariosGrid');
            container.innerHTML = '';

            const horariosDisponibles = ['08:00', '09:00', '10:00', '11:00', '12:00', '14:00', '15:00', '16:00', '17:00'];

            horariosDisponibles.forEach(hora => {
                const card = document.createElement('div');
                card.className = 'servicio-card';
                if (estadoBooking.horaSeleccionada === hora) {
                    card.classList.add('selected');
                }
                card.innerHTML = `<div style="font-size: 1.2rem; font-weight: 600;">${hora}</div>`;
                card.addEventListener('click', () => {
                    estadoBooking.horaSeleccionada = hora;
                    actualizarUI();
                });
                container.appendChild(card);
            });
        }

        // ====== CONFIRMAR CITA ======
        function confirmarCita(event) {
            event.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefono = document.getElementById('telefono').value.trim();

            if (!nombre || !email || !telefono) {
                mostrarModal('⚠️', 'Datos Incompletos', 'Por favor completa todos los campos requeridos.');
                return;
            }

            const fecha = document.getElementById('datePicker').value;
            if (!fecha) {
                mostrarModal('⚠️', 'Fecha No Seleccionada', 'Por favor selecciona una fecha.');
                return;
            }

            const servicio = servicios.find(s => s.id == estadoBooking.servicioSeleccionado);
            const doctor = doctores.find(d => d.id == estadoBooking.doctorSeleccionado);
            const fechaObj = new Date(fecha);
            const fechaFormato = fechaObj.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });

            mostrarModal('✅', '¡Cita Confirmada!', `Tu cita para ${servicio.nombre} con ${doctor.nombre} el ${fechaFormato} a las ${estadoBooking.horaSeleccionada}h ha sido confirmada.`);

            resetearForm();
        }

        // ====== MOSTRAR MODAL ======
        function mostrarModal(icon, title, message) {
            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icon">${icon}</div>
                    <h3 style="color: var(--primary); margin-bottom: 1rem; text-align: center;">${title}</h3>
                    <p style="color: var(--secondary); margin-bottom: 1.5rem; text-align: center;">${message}</p>
                    <button class="btn-primary" onclick="cerrarModal()" style="width: 100%;">Cerrar</button>
                </div>
            `;
            modal.classList.add('active');
        }

        // ====== CERRAR MODAL ======
        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // ====== RESETEAR FORM ======
        function resetearForm() {
            estadoBooking = {
                pasoActual: 1,
                servicioSeleccionado: null,
                doctorSeleccionado: null,
                fechaSeleccionada: null,
                horaSeleccionada: null,
                nombre: '',
                email: '',
                telefono: '',
                asunto: ''
            };

            document.getElementById('nombre').value = '';
            document.getElementById('email').value = '';
            document.getElementById('telefono').value = '';
            document.getElementById('asunto').value = '';
            document.getElementById('datePicker').value = '';

            document.getElementById('bookingSection').style.display = 'none';
            document.getElementById('initialButton').style.display = 'block';
        }

        // ====== VER PERFIL DOCTOR ======
        function verPerfilDoctor(id) {
            const doctor = doctores.find(d => d.id == id);
            let especialidades = doctor.especialidades.join(', ');
            const modal = document.getElementById('modal');

            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icon" style="font-size: 4rem; margin-bottom: 1rem;">${doctor.foto}</div>
                    <h3 style="color: var(--primary); margin-bottom: 0.5rem; text-align: center;">${doctor.nombre}</h3>
                    <p style="color: var(--primary-light); font-weight: 600; margin-bottom: 1rem; text-align: center;">${doctor.especialidad}</p>
                    <p style="color: var(--secondary); margin-bottom: 1rem; text-align: justify;">${doctor.descripcion}</p>
                    <p style="color: var(--text); font-weight: 600; margin-bottom: 0.5rem;">Especialidades:</p>
                    <p style="color: var(--secondary); margin-bottom: 1.5rem;">${especialidades}</p>
                    <button class="btn-primary" onclick="cerrarModal()" style="width: 100%;">Cerrar</button>
                </div>
            `;

            modal.classList.add('active');
        }

        // ====== MOSTRAR ERROR ======
        function mostrarError(mensaje) {
            const container = document.querySelector('.container');
            container.innerHTML = `<div style="text-align: center; padding: 2rem; color: red;"><p>${mensaje}</p></div>`;
        }

        // ====== INICIAR AL CARGAR PÁGINA ======
        window.addEventListener('load', () => {
            crearPasos();
            cargarCSV();
        });
    </script>
</body>
</html>
